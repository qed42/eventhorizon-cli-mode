[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventhorizon-cli"
version = "0.1.0"
description = "A fast, focused CLI tool for Drupal codebase performance and security static analysis."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "QED42"},
]
keywords = ["drupal", "static-analysis", "security", "performance", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.0,<9.0",
    "rich>=13.0,<16.0",
    "PyYAML>=6.0,<7.0",
    "openpyxl>=3.0,<4.0",
]

[project.urls]
Homepage = "https://github.com/qed42/eventhorizon-cli-mode"
Repository = "https://github.com/qed42/eventhorizon-cli-mode"
"Bug Tracker" = "https://github.com/qed42/eventhorizon-cli-mode/issues"
Changelog = "https://github.com/qed42/eventhorizon-cli-mode/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Pinned to a compatible release: new ruff minors add rules, which would
    # make `ruff check` fail on unchanged code. Bump deliberately, fixing any
    # new findings in the same PR. Keep in sync with .github/workflows/lint.yml.
    "ruff~=0.15.7",
]

[project.scripts]
eventhorizon = "eventhorizon.cli:cli"
eh = "eventhorizon.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eventhorizon = ["scanner/rules/*.yml", "py.typed"]
"eventhorizon.scanner.rules" = ["*.yml"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
