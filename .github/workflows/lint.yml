name: lint

on:
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/lint.yml'
  push:
    branches: [master]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/lint.yml'

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Keep the version range in sync with the dev dependency in pyproject.toml.
      - name: Install ruff
        run: pip install "ruff~=0.15.7"

      - name: ruff check
        run: ruff check src/ tests/ --output-format=github
